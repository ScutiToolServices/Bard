# Bard text-to-speech MCP server.
# Start:  docker compose up -d --build        (armory reaches it at http://bard:29400/mcp)
# Needs a .env next to this file with INTERNAL_API_TOKEN (same value as Citadel's); see .env.example.

name: bard

services:
  bard:
    build: .
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      SERVICE_VOICE: ${SERVICE_VOICE:-}
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
    ports:
      - "${SERVICE_BIND:-0.0.0.0}:${SERVICE_PORT:-29400}:29400"
    volumes:
      - bard_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29400/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [citadel]

volumes:
  bard_data:

networks:
  # Join the Citadel stack's network so armory/ember_api can reach http://bard:29400. Start the Citadel stack first:
  # it creates this network.
  citadel:
    name: citadel_core
    external: true
